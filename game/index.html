<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puerto Luna — an open-world crime story</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b1620;
    height: 100%;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px;
    box-sizing: border-box;
  }
  canvas {
    display: block;
    width: min(1280px, 96vw);
    height: auto;
    border-radius: 10px;
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
    background: #14607f;
  }
  #note {
    color: #9fb4c4;
    font-size: 14px;
    margin: 0;
    text-align: center;
  }
  #note b { color: #ffd34d; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <p id="note"><b>PUERTO LUNA</b> — WASD move / drive · E enter &amp; exit cars, pick up fares · Click to shoot · ESC pause · M mute</p>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
